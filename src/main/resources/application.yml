server:
  address: 127.0.0.1
  port: ${PORT:8080}
  servlet:
    context-path: /travel
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: shanhai-travel
  profiles:
    default: demo
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    log-resolved-exception: false
  flyway:
    baseline-on-migrate: false
  datasource:
    hikari:
      maximum-pool-size: 8
      transaction-isolation: TRANSACTION_READ_COMMITTED
logging:
  level:
    org.springframework.security: WARN
