server:
  address: 127.0.0.1
  port: ${PORT:8080}
  servlet:
    context-path: /travel
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: shanhai-travel
  profiles:
    default: demo
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    log-resolved-exception: false
  flyway:
    baseline-on-migrate: false
  datasource:
    hikari:
      maximum-pool-size: 8
      transaction-isolation: TRANSACTION_READ_COMMITTED
logging:
  level:
    org.springframework.security: WARN
# 健康检查：容器编排与冒烟脚本复用同一个探针，只暴露聚合状态，不泄露内部细节
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: 山海行旅行社管理系统
    version: 2.0.0
# 接口文档：答辩与前端联调入口，路径保持 Spring 生态默认值
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
